name: Daily gold rate

on:
  schedule:
    - cron: "30 4 * * *"   # 04:30 UTC = 10:00 AM IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-rates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright and Chromium
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Fetch rates and build report
        run: python grt_rate_tracker.py
      - name: Publish report as the web page
        run: cp data/report.html index.html
      - name: Save debug files if something went wrong
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-files
          path: data/debug_*
          if-no-files-found: ignore
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gold_rates.csv index.html
          git diff --cached --quiet || git commit -m "Update rates $(TZ=Asia/Kolkata date +'%Y-%m-%d %H:%M')"
          git push
